<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366" />
      <stop offset="100%" stop-color="#128C7E" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00F2FE" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Hexagonal Tech Shield Icon -->
  <g transform="translate(8, 6)" filter="url(#shadow)">
    <!-- Outer Hexagon -->
    <path d="M26 2 L48 14 L48 38 L26 50 L4 38 L4 14 Z" fill="#0B132B" stroke="url(#brandGrad)" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Inner Accent -->
    <path d="M26 8 L42 17 L42 35 L26 44 L10 35 L10 17 Z" fill="#0F1F38" opacity="0.8"/>
    <!-- Tech Node Signal -->
    <circle cx="26" cy="18" r="3.5" fill="url(#glowGrad)"/>
    <path d="M19 28 L26 22 L33 28 L26 34 Z" fill="url(#brandGrad)"/>
    <!-- Terminal prompt dash -->
    <line x1="20" y1="39" x2="32" y2="39" stroke="#00F2FE" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <g transform="translate(70, 41)">
    <text font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="25" letter-spacing="-0.5" fill="#FFFFFF">
      AHMAD<tspan fill="url(#brandGrad)"> TECH</tspan>
    </text>
  </g>
  <g transform="translate(71, 54)">
    <text font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9" letter-spacing="2.2" fill="#94A3B8">
      WHATSAPP BOT GATEWAY
    </text>
  </g>
</svg>
